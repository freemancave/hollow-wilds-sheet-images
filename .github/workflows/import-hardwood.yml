name: Import hardwood sheet image
on:
  push:
    paths:
      - ".github/workflows/import-hardwood.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download hardwood image
        run: |
          curl --fail --location 'https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-e818-8206-b251-8bd6d3691af3/raw?se=2026-10-05T16%3A18%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=e1f687f2-28cf-481d-97c5-d0f769a9fdd6&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T23%3A46%3A19Z&ske=2026-10-05T23%3A46%3A19Z&sks=b&skv=2026-02-06&sig=mbWlzkX6QXZcezIg8LTGCppN730OWuDpsndpDLqqBjk%3D' --output material_hardwood.png
          test -s material_hardwood.png
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add material_hardwood.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update hardwood sheet image"
          git push
