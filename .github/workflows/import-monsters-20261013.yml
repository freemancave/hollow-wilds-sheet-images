name: Import 2026-10-13 monster sheet illustrations

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-monsters-20261013.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download uploaded monster artwork
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://oaisdmntprwestus.blob.core.windows.net/files/00000000-c820-8230-8ced-228577a216cc/raw?se=2026-10-13T08%3A34%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=48f093cd-a5e4-4eb3-98b0-389c3f767705&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A16%3A50Z&ske=2026-10-14T00%3A16%3A50Z&sks=b&skv=2026-02-06&sig=GmI2GzXxSLX9GYZmAXG1gWk4N3fykk4Z5/LEQH6f4vQ%3D' -o 'codex_gramic_20261013.png'
          test -s 'codex_gramic_20261013.png'
          curl -L --fail --retry 3 'https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-cf44-81f5-81d0-544caba4a9f8/raw?se=2026-10-13T08%3A34%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=48f093cd-a5e4-4eb3-98b0-389c3f767705&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T22%3A32%3A57Z&ske=2026-10-13T22%3A32%3A57Z&sks=b&skv=2026-02-06&sig=zBvCiyfCxYYOpAo5UyKdMneNo3vpmGCNuRC4sKC3ZVs%3D' -o 'codex_bruka_20261013.png'
          test -s 'codex_bruka_20261013.png'
          curl -L --fail --retry 3 'https://oaisdmntpreastus2.blob.core.windows.net/files/00000000-7904-81f6-88ef-6e96f34b75e8/raw?se=2026-10-13T08%3A34%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=48f093cd-a5e4-4eb3-98b0-389c3f767705&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A27%3A40Z&ske=2026-10-14T00%3A27%3A40Z&sks=b&skv=2026-02-06&sig=8ilsTtB0UPFoYJXkXWH0grDMLUl3ouBGP%2Bzmo61HE5E%3D' -o 'codex_florax_20261013.png'
          test -s 'codex_florax_20261013.png'
          curl -L --fail --retry 3 'https://oaisdmntprjapaneast.blob.core.windows.net/files/00000000-1d44-8209-8c02-70c165cc3b71/raw?se=2026-10-13T08%3A34%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=48f093cd-a5e4-4eb3-98b0-389c3f767705&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A22%3A53Z&ske=2026-10-14T00%3A22%3A53Z&sks=b&skv=2026-02-06&sig=/z4B8N1LwJ2/VG%2BBOHblm5/1H3Xlzogr41tCuARX2SA%3D' -o 'monster_florax_sheet_20261013.png'
          test -s 'monster_florax_sheet_20261013.png'
      - name: Confirm PNG signatures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ["codex_gramic_20261013.png","codex_bruka_20261013.png","codex_florax_20261013.png","monster_florax_sheet_20261013.png"]:
              data = Path(name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              print(name, len(data))
          PY
      - name: Commit artwork to public image repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex_gramic_20261013.png codex_bruka_20261013.png codex_florax_20261013.png monster_florax_sheet_20261013.png
          git commit -m "Add Gramic Bruka Florax spreadsheet images" || exit 0
          git push
